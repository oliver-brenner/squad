# PowerSync sync rules — what each authenticated user is allowed to sync.
#
# Apply these in your PowerSync Cloud dashboard:
#   Project → Sync Rules → paste this file → Deploy.
#
# `request.user_id()` returns the `sub` claim of the Supabase JWT.

bucket_definitions:
  user_profile:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM profiles WHERE id = bucket.user_id

  user_exercises:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM exercises WHERE user_id = bucket.user_id

  user_workouts:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM workouts WHERE user_id = bucket.user_id

  # `user_id` is denormalised onto `sets` (kept in sync by a Postgres trigger
  # — see `db/migrations` notes). Lets us bucket sets directly by user without
  # the parameter query needing to join `workouts`, which PowerSync's
  # single-table parser doesn't allow.
  user_sets:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM sets WHERE user_id = bucket.user_id

  user_field_options:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM user_field_options WHERE user_id = bucket.user_id

  # The user's session templates and their skeleton sets. Templates are
  # private — there's no followee_* counterpart. user_id is denormalised onto
  # template_sets so we bucket it directly (same as user_sets).
  user_templates:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM templates WHERE user_id = bucket.user_id

  user_template_sets:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM template_sets WHERE user_id = bucket.user_id

  # Guests tagged on the user's own sessions. user_id is the session owner
  # (denormalised on session_guests), so we bucket by it directly.
  user_session_guests:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM session_guests WHERE user_id = bucket.user_id

  # Both ends of a follow edge receive the row, so the user can see who
  # follows them AND who they follow.
  user_follows:
    parameters:
      - SELECT request.user_id() as user_id
    data:
      - SELECT * FROM follows WHERE follower_id = bucket.user_id
      - SELECT * FROM follows WHERE followee_id = bucket.user_id

  # ----- Followee data (powers the Friends feed) -----
  # One bucket per user this user follows. PowerSync re-evaluates parameter
  # queries when follows rows change, so following someone immediately starts
  # syncing their data; unfollowing immediately stops.

  # Profile snapshots for everyone you follow — needed to render their name
  # and avatar in the feed.
  followee_profiles:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM profiles WHERE id = bucket.user_id

  # Followees' exercise library, so we can resolve exercise_id → name in
  # their sessions without a server round-trip.
  followee_exercises:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM exercises WHERE user_id = bucket.user_id

  # Followees' field options (their custom categories, equipment, muscle
  # groups) — so their exercise tags render with the labels they intended,
  # not whatever the viewer happens to have locally.
  followee_field_options:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM user_field_options WHERE user_id = bucket.user_id

  # Followees' workouts — the rows the feed lists chronologically.
  #
  # NOTE: we explored a rolling "last 30 days" cap at the sync layer but
  # PowerSync rules don't currently support it (bucket params only allow
  # equality, request.parameters isn't available in data queries, parameter
  # queries can't JOIN/subquery). `performed_on` is still denormalised onto
  # `sets` — defensive and ready to use the moment PowerSync lifts one of
  # those restrictions, or if we route this through a Postgres view that
  # bakes in `CURRENT_DATE - 30`.
  followee_workouts:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM workouts WHERE user_id = bucket.user_id

  # Followee sets — same caveat as followee_workouts.
  followee_sets:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM sets WHERE user_id = bucket.user_id

  # Followees' session guests — so a friend's session shows who they trained
  # with. (The guest's own profile is resolved live; if the viewer doesn't
  # follow that guest the app falls back to a remote profile fetch.)
  followee_session_guests:
    parameters:
      - SELECT followee_id as user_id FROM follows WHERE follower_id = request.user_id()
    data:
      - SELECT * FROM session_guests WHERE user_id = bucket.user_id
